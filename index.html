<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اياد نادر | نصنع بوتات وبرامج</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet"><style>*{font-family:Tajawal,sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#080b18;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}.bg{position:fixed;inset:0;z-index:-1}.blob{position:absolute;border-radius:50%;filter:blur(85px);opacity:.8;animation:float 10s infinite ease-in-out}.b1{width:700px;height:700px;background:radial-gradient(circle,#ec4899 0%,#be185d 60%);top:-200px;left:-180px}.b2{width:650px;height:650px;background:radial-gradient(circle,#3b82f6 0%,#1e40af 60%);bottom:-200px;right:-180px;animation-delay:2s}.b3{width:500px;height:500px;background:radial-gradient(circle,#06b6d4 0%,#0e7490 60%);top:40%;left:40%;animation-delay:4s}@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.15)}}.card{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.24);width:100%;max-width:440px;border-radius:44px;padding:36px 28px 28px;text-align:center;box-shadow:0 35px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35);animation:pop .9s ease}@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}.badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(236,72,153,.28),rgba(6,182,212,.28));border:1px solid rgba(6,182,212,.6);color:#a5f3fc;padding:9px 20px;border-radius:100px;font-size:13px;font-weight:800;margin-bottom:20px;box-shadow:0 0 25px rgba(6,182,212,.4)}.dot{width:10px;height:10px;background:#22d3ee;border-radius:50%;box-shadow:0 0 12px #22d3ee;animation:blink 1.6s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}.avatar-wrap{position:relative;width:172px;height:172px;margin:0 auto 20px}.r1{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,#ec4899,#3b82f6,#06b6d4,#ec4899);animation:spin 4s linear infinite}.r2{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 180deg,#06b6d4,#fff,#ec4899,#3b82f6);animation:spin 2.2s linear infinite reverse;opacity:.9}.bg-ring{position:absolute;inset:0;border-radius:50%;background:#0f1229}@keyframes spin{to{transform:rotate(360deg)}}.avatar{position:absolute;inset:6px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 0 5px #0f1229}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-family:Reem Kufi,sans-serif;font-size:40px;font-weight:700;background:linear-gradient(95deg,#f9a8d4 10%,#67e8f9 50%,#93c5fd 90%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3.5s linear infinite;line-height:1.1}@keyframes shine{to{background-position:200% center}}.role{margin-top:6px;color:#67e8f9;font-size:14px;font-weight:800;letter-spacing:1px}.quote{margin:18px 0 0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15));border:1px solid rgba(255,255,255,.12);border-left:3px solid #ec4899;border-right:3px solid #06b6d4;border-radius:22px;padding:18px 16px}.quote-main{color:#fff;font-size:17px;font-weight:900;line-height:1.5}.quote-sub{color:#d1d5db;font-size:13.5px;line-height:1.9;margin-top:10px}.quote-sub b{color:#67e8f9}.services{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}.service{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 10px;text-align:center;transition:.3s}.service:hover{transform:translateY(-2px);border-color:rgba(236,72,153,.4)}.service-icon{font-size:22px;margin-bottom:4px}.service-title{font-size:12.5px;font-weight:800;color:#fff}.service-desc{font-size:10px;color:#9ca3af;margin-top:3px}.btns{display:flex;flex-direction:column;gap:12px;margin-top:22px}.btn{padding:17px;border-radius:18px;text-decoration:none;font-weight:900;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;transition:.35s}.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-130%);transition:.75s}.btn:hover::after{transform:translateX(130%)}.btn:hover{transform:translateY(-3px)}.btn-wa{background:linear-gradient(135deg,#ec4899 0%,#8b5cf6 50%,#06b6d4 100%);color:#fff;box-shadow:0 14px 32px rgba(236,72,153,.45)}.btn-call{background:linear-gradient(135deg,#fff,#cffafe);color:#0e172a}.footer{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:10.5px;color:#9ca3af}</style></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><div class="card"><div class="badge"><div class="dot"></div> نصنع بوتات وبرامج 🤖</div><div class="avatar-wrap"><div class="r1"></div><div class="r2"></div><div class="bg-ring"></div><div class="avatar"><img src="avatar.jpg"></div></div><div class="name">اياد نادر
